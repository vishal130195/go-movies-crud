<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies CRUD App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
        }

        .section h2::before {
            content: '';
            width: 4px;
            height: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-right: 15px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        input, button {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #36d1dc 0%, #5b86e5 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #feca57 0%, #ff9ff3 100%);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .movie-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .movie-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .movie-info {
            margin-bottom: 15px;
        }

        .movie-info p {
            margin: 5px 0;
            color: #666;
        }

        .movie-info strong {
            color: #333;
        }

        .movie-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .movie-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            padding-left: 45px;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            z-index: 1;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            width: auto;
            padding: 5px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .movies-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Movies Management</h1>
            <p>Manage your favorite movies with style</p>
        </div>

        <div class="content">
            <!-- Alert Messages -->
            <div id="alertSuccess" class="alert alert-success"></div>
            <div id="alertError" class="alert alert-error"></div>

            <!-- Statistics -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalMovies">0</div>
                    <div class="stat-label">Total Movies</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalDirectors">0</div>
                    <div class="stat-label">Unique Directors</div>
                </div>
            </div>

            <!-- Add Movie Section -->
            <div class="section">
                <h2>Add New Movie</h2>
                <form id="movieForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Movie Title</label>
                            <input type="text" id="title" name="title" placeholder="Enter movie title" required>
                        </div>
                        <div class="form-group">
                            <label for="isbn">ISBN</label>
                            <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">Director First Name</label>
                            <input type="text" id="firstname" name="firstname" placeholder="Enter first name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Director Last Name</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Enter last name" required>
                        </div>
                    </div>
                    <button type="submit" id="submitBtn">
                        <span id="submitText">Add Movie</span>
                        <span id="submitLoading" class="loading" style="display: none;"></span>
                    </button>
                </form>
            </div>

            <!-- Movies List Section -->
            <div class="section">
                <h2>Movies Collection</h2>
                
                <!-- Search Box -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search movies by title or director...">
                </div>

                <button id="refreshBtn" class="btn-secondary" onclick="loadMovies()">
                    🔄 Refresh Movies
                </button>

                <div id="moviesContainer">
                    <div class="empty-state">
                        <h3>No movies found</h3>
                        <p>Add your first movie using the form above!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Movie Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Movie</h3>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editMovieForm">
                <input type="hidden" id="editMovieId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editTitle">Movie Title</label>
                        <input type="text" id="editTitle" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="editIsbn">ISBN</label>
                        <input type="text" id="editIsbn" name="isbn" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editFirstname">Director First Name</label>
                        <input type="text" id="editFirstname" name="firstname" required>
                    </div>
                    <div class="form-group">
                        <label for="editLastname">Director Last Name</label>
                        <input type="text" id="editLastname" name="lastname" required>
                    </div>
                </div>
                <button type="submit" class="btn-warning">Update Movie</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let movies = [];
        let filteredMovies = [];

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadMovies();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Form submission
            document.getElementById('movieForm').addEventListener('submit', handleAddMovie);
            document.getElementById('editMovieForm').addEventListener('submit', handleEditMovie);
            
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            
            // Modal close on outside click
            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });
        }

        // Show alert messages
        function showAlert(message, type = 'success') {
            const alertElement = document.getElementById(type === 'success' ? 'alertSuccess' : 'alertError');
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, 5000);
        }

        // Load all movies
        async function loadMovies() {
            try {
                const response = await fetch(`${API_BASE}/movies`);
                if (!response.ok) throw new Error('Failed to load movies');
                
                movies = await response.json();
                filteredMovies = [...movies];
                displayMovies(filteredMovies);
                updateStats();
            } catch (error) {
                console.error('Error loading movies:', error);
                showAlert('Failed to load movies. Make sure the server is running.', 'error');
            }
        }

        // Display movies in the UI
        function displayMovies(moviesToShow) {
            const container = document.getElementById('moviesContainer');
            
            if (!moviesToShow || moviesToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No movies found</h3>
                        <p>Add your first movie using the form above!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="movies-grid">
                    ${moviesToShow.map(movie => `
                        <div class="movie-card">
                            <div class="movie-title">${escapeHtml(movie.title)}</div>
                            <div class="movie-info">
                                <p><strong>ISBN:</strong> ${escapeHtml(movie.isbn)}</p>
                                <p><strong>Director:</strong> ${escapeHtml(movie.director.firstname)} ${escapeHtml(movie.director.lastname)}</p>
                                <p><strong>ID:</strong> ${escapeHtml(movie.id)}</p>
                            </div>
                            <div class="movie-actions">
                                <button class="btn-warning" onclick="openEditModal('${movie.id}')">✏️ Edit</button>
                                <button class="btn-danger" onclick="deleteMovie('${movie.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Handle search
        function handleSearch(e) {
            const searchTerm = e.target.value.toLowerCase();
            filteredMovies = movies.filter(movie => 
                movie.title.toLowerCase().includes(searchTerm) ||
                movie.director.firstname.toLowerCase().includes(searchTerm) ||
                movie.director.lastname.toLowerCase().includes(searchTerm)
            );
            displayMovies(filteredMovies);
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalMovies').textContent = movies.length;
            
            const uniqueDirectors = new Set(
                movies.map(movie => `${movie.director.firstname} ${movie.director.lastname}`)
            );
            document.getElementById('totalDirectors').textContent = uniqueDirectors.size;
        }

        // Handle add movie form submission
        async function handleAddMovie(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitLoading = document.getElementById('submitLoading');
            
            // Show loading state
            submitText.style.display = 'none';
            submitLoading.style.display = 'inline-block';
            submitBtn.disabled = true;

            const formData = new FormData(e.target);
            const movieData = {
                title: formData.get('title'),
                isbn: formData.get('isbn'),
                director: {
                    firstname: formData.get('firstname'),
                    lastname: formData.get('lastname')
                }
            };

            try {
                const response = await fetch(`${API_BASE}/movies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(movieData)
                });

                if (!response.ok) throw new Error('Failed to add movie');

                const newMovie = await response.json();
                showAlert('Movie added successfully!', 'success');
                e.target.reset();
                loadMovies(); // Reload to get updated list
            } catch (error) {
                console.error('Error adding movie:', error);
                showAlert('Failed to add movie. Please try again.', 'error');
            } finally {
                // Reset button state
                submitText.style.display = 'inline';
                submitLoading.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        // Open edit modal
        function openEditModal(movieId) {
            const movie = movies.find(m => m.id === movieId);
            if (!movie) return;

            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('editTitle').value = movie.title;
            document.getElementById('editIsbn').value = movie.isbn;
            document.getElementById('editFirstname').value = movie.director.firstname;
            document.getElementById('editLastname').value = movie.director.lastname;
            
            document.getElementById('editModal').style.display = 'block';
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Handle edit movie form submission
        async function handleEditMovie(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const movieId = document.getElementById('editMovieId').value;
            
            const movieData = {
                id: movieId,
                title: formData.get('title'),
                isbn: formData.get('isbn'),
                director: {
                    firstname: formData.get('firstname'),
                    lastname: formData.get('lastname')
                }
            };

            try {
                const response = await fetch(`${API_BASE}/movie/update`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(movieData)
                });

                if (!response.ok) throw new Error('Failed to update movie');

                showAlert('Movie updated successfully!', 'success');
                closeEditModal();
                loadMovies(); // Reload to get updated list
            } catch (error) {
                console.error('Error updating movie:', error);
                showAlert('Failed to update movie. Please try again.', 'error');
            }
        }

        // Delete movie
        async function deleteMovie(movieId) {
            if (!confirm('Are you sure you want to delete this movie?')) return;

            try {
                const response = await fetch(`${API_BASE}/movie/delete?id=${movieId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete movie');

                showAlert('Movie deleted successfully!', 'success');
                loadMovies(); // Reload to get updated list
            } catch (error) {
                console.error('Error deleting movie:', error);
                showAlert('Failed to delete movie. Please try again.', 'error');
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
